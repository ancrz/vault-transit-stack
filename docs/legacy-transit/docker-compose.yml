# =============================================
# Vault Transit Stack — Docker Compose
# Dual Vault with Transit Auto-Unseal
# =============================================

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-vault-common: &vault-common
  restart: unless-stopped
  cap_add:
    - IPC_LOCK
  logging: *logging

services:
  vault-a:
    <<: *vault-common
    build:
      context: ./vault-a
      dockerfile: Dockerfile
      args:
        - VAULT_TAG=${VAULT_TAG:-1.15.4}
        - UID_ARG=${HOST_UID:-1000}
        - GID_ARG=${HOST_GID:-1000}
    container_name: ${VAULT_A_CONTAINER_NAME:-vault-a-server}
    hostname: ${VAULT_A_CONTAINER_NAME:-vault-a-server}
    ports:
      - "127.0.0.1:${VAULT_A_PORT:-8282}:${VAULT_CONTAINER_LISTEN_PORT:-8200}"
    env_file:
      - ./.env
    environment:
      - VAULT_ADDR=${VAULT_INTERNAL_ADDR}
      - VAULT_API_ADDR=http://0.0.0.0:${VAULT_CONTAINER_LISTEN_PORT:-8200}
    volumes:
      - ./vault-a/file:/vault/file:rw
      - ./vault-a/logs:/vault/logs:rw
      - ./vault-a/config:/vault/config:rw
    healthcheck:
      test: ["CMD-SHELL", "vault status | grep '^Sealed' | awk '{print $$2}' | grep -q 'false'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vault-internal
    deploy:
      resources:
        limits:
          memory: ${VAULT_A_MEM_LIMIT:-256m}
        reservations:
          memory: ${VAULT_A_MEM_RESERVATION:-128m}

  vault-b:
    <<: *vault-common
    build:
      context: ./vault-b
      dockerfile: Dockerfile
      args:
        - VAULT_TAG=${VAULT_TAG:-1.15.4}
        - UID_ARG=${HOST_UID:-1000}
        - GID_ARG=${HOST_GID:-1000}
    container_name: ${VAULT_B_CONTAINER_NAME:-vault-b-server}
    hostname: ${VAULT_B_CONTAINER_NAME:-vault-b-server}
    ports:
      - "127.0.0.1:${VAULT_B_PORT:-8283}:${VAULT_CONTAINER_LISTEN_PORT:-8200}"
    env_file:
      - ./.env
    environment:
      - VAULT_ADDR=${VAULT_INTERNAL_ADDR}
      - VAULT_API_ADDR=http://0.0.0.0:${VAULT_CONTAINER_LISTEN_PORT:-8200}
    volumes:
      - ./vault-b/file:/vault/file:rw
      - ./vault-b/logs:/vault/logs:rw
      - ./vault-b/config:/vault/config:rw
    depends_on:
      vault-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "vault status 2>&1 | grep -E '(Sealed\\s+false|initialized\\s+false)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - vault-internal
    deploy:
      resources:
        limits:
          memory: ${VAULT_B_MEM_LIMIT:-256m}
        reservations:
          memory: ${VAULT_B_MEM_RESERVATION:-128m}

networks:
  vault-internal:
    name: ${NETWORK_NAME:-vault-internal}
    driver: bridge
