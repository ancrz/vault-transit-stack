---
# =============================================================================
# Vault Auto-Unseal Playbook
# =============================================================================
# Usage:
#   ansible-playbook vault-unseal.yml --ask-vault-pass
#   ansible-playbook vault-unseal.yml --vault-password-file ~/.vault_pass
# =============================================================================

- name: Vault Auto-Unseal
  hosts: vault_hosts
  gather_facts: false

  vars_files:
    - vars/vault_keys.yml

  tasks:
    - name: Check vault seal status
      block:
        - name: Query seal status endpoint
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/sys/seal-status"
            method: GET
            return_content: true
            status_code: [200, 503]
          register: seal_status
      rescue:
        - name: Vault is unreachable
          ansible.builtin.fail:
            msg: >
              Cannot connect to Vault at {{ vault_addr }}.
              Ensure the container is running: docker compose up -d

    - name: Display vault status
      ansible.builtin.debug:
        msg: >-
          Vault status — initialized: {{ seal_status.json.initialized }},
          sealed: {{ seal_status.json.sealed }},
          threshold: {{ seal_status.json.t }}/{{ seal_status.json.n }}
      when: seal_status.json is defined

    - name: Fail if vault is not initialized
      ansible.builtin.fail:
        msg: >
          Vault is not initialized. Run first-time setup:
          docker exec {{ vault_container_name | default('vault-server') }}
            vault operator init -key-shares={{ seal_status.json.n }}
            -key-threshold={{ seal_status.json.t }} -format=json
      when:
        - seal_status.json is defined
        - not seal_status.json.initialized

    - name: Vault is already unsealed
      ansible.builtin.debug:
        msg: "Vault is already unsealed. No action needed."
      when:
        - seal_status.json is defined
        - not seal_status.json.sealed

    - name: Apply unseal keys
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/unseal"
        method: PUT
        body_format: json
        body:
          key: "{{ item }}"
        return_content: true
        status_code: [200]
      loop: "{{ vault_unseal_keys[:seal_status.json.t] }}"
      loop_control:
        label: "unseal_key_{{ ansible_loop.index }}"
        extended: true
      no_log: true
      register: unseal_results
      when:
        - seal_status.json is defined
        - seal_status.json.sealed

    - name: Verify vault is unsealed
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/seal-status"
        method: GET
        return_content: true
        status_code: [200]
      register: final_status
      when:
        - seal_status.json is defined
        - seal_status.json.sealed

    - name: Report final status
      ansible.builtin.debug:
        msg: >-
          Unseal complete — sealed: {{ final_status.json.sealed | default(seal_status.json.sealed) }},
          version: {{ final_status.json.version | default(seal_status.json.version) | default('unknown') }}
      when: final_status.json is defined or seal_status.json is defined

    - name: Fail if still sealed after unseal attempt
      ansible.builtin.fail:
        msg: >
          Vault is still sealed after applying {{ seal_status.json.t }} keys.
          Check that the unseal keys in vault_keys.yml are correct.
      when:
        - final_status.json is defined
        - final_status.json.sealed
