# =============================================
# Vault Transit Stack — Docker Compose
# Single Vault with Shamir Seal
# =============================================

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
      args:
        - VAULT_TAG=${VAULT_TAG:-1.15.4}
        - UID_ARG=${HOST_UID:-1000}
        - GID_ARG=${HOST_GID:-1000}
    container_name: ${VAULT_CONTAINER_NAME:-vault-server}
    hostname: ${VAULT_CONTAINER_NAME:-vault-server}
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:${VAULT_CONTAINER_LISTEN_PORT:-8200}"
    env_file:
      - ./.env
    environment:
      - VAULT_ADDR=${VAULT_INTERNAL_ADDR:-http://127.0.0.1:8200}
      - VAULT_API_ADDR=http://0.0.0.0:${VAULT_CONTAINER_LISTEN_PORT:-8200}
    volumes:
      - ./vault/file:/vault/file:rw
      - ./vault/logs:/vault/logs:rw
      - ./vault/config:/vault/config:rw
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; rc=$$?; [ $$rc -le 2 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vault-internal
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${VAULT_MEM_LIMIT:-256m}
        reservations:
          memory: ${VAULT_MEM_RESERVATION:-128m}

networks:
  vault-internal:
    name: ${NETWORK_NAME:-vault-internal}
    driver: bridge
